[tool.poetry]
name = "baby-arb-ke"
version = "0.1.0"
description = "US-to-Kenya arbitrage pipeline for used baby items, run by an agentic dev team."
authors = ["Watson Ndethi <watson@example.com>"]
readme = "README.md"
packages = [{include = "baby_arb", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27"
pydantic = "^2.7"
pydantic-settings = "^2.3"
sqlmodel = "^0.0.22"
structlog = "^24.1"
typer = "^0.12"
python-dateutil = "^2.9"
tenacity = "^8.3"
rich = "^13.7"
fastapi = {version = "^0.115", optional = true}
uvicorn = {version = "^0.30", optional = true}

[tool.poetry.extras]
api = ["fastapi", "uvicorn"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
respx = "^0.21"
commitizen = "^3.27"
pre-commit = "^3.7"
ruff = "^0.5"
mypy = "^1.10"

[tool.poetry.scripts]
baby-arb = "baby_arb.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires external services (skipped by default)",
    "slow: long-running test"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
